<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styles/contact.css">
    <link rel="stylesheet" href="./styles/navbar.css">
    <style>
.popup-container {
  display: none; 
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(5px);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.popup-form {
  background: white;
  padding: 2rem;
  border-radius: 10px;
  width: 90%;
  max-width: 450px;
  box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
  position: relative;
  animation: popupIn 0.3s ease-out;
}

.popup-form h2 {
  margin-bottom: 1rem;
  text-align: center;
  font-weight: bold;
}

.popup-form label {
  font-size: 0.9rem;
  font-weight: 500;
}

.popup-form input,
.popup-form textarea {
  width: 100%;
  padding: 0.7rem;
  margin: 0.4rem 0 1rem 0;
  border-radius: 5px;
  border: 1px solid #ccc;
  outline: none;
}

.popup-form button {
  background-color: #bf1363;
  color: white;
  padding: 0.8rem;
  width: 100%;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 1rem;
}

.close-btn {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 1.5rem;
  cursor: pointer;
  color: #333;
}

@keyframes popupIn {
  from {
    opacity: 0;
    transform: scale(0.7);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* Blur Effect */
.blur {
  filter: blur(5px);
  pointer-events: none;
}

    </style>
</head>
<body>
     <nav>
      <div class="navItemContainer">
        <a href="./index.html">home</a>
        <a href="./explore.html">explore</a>
      </div>
      <a href="./index.html">
        <img id="websiteLogo" src="./images/logo.png" alt="logo"
      /></a>
      <div class="navItemContainer">
        <a href="">contact</a>
        <a href="">about</a>
        <div>
          <a href=""
            ><img id="loginIcon" src="./images/login.png" alt="login"
          /></a>
          <a href=""><button id="navBtn">sign in</button></a>
        </div>
      </div>
    </nav>
    <div id="authModal" class="authOverlay">
  <div class="authBox">
    <span id="authCloseBtn">&times;</span>
    <h2>Login</h2>
    <input type="text" placeholder="Email" />
    <input type="password" placeholder="Password" />
    <button id="authSubmitBtn">Login</button>
  </div>
</div>
    <main>
<div class="contactHeroContainer">
  <div class="contactTextContainer">
      <h1 id="contactFeed">we'd love to hear from you.</h1>
      <h1 class="heroFeed">
            <span class="titleSpan">R</span>EA<span class="titleSpan">C</span>H<span> <span class="titleSpan">O</span><spanc class="titleSpan">U</span>T <span class="titleSpan">T</span>O US          
            </h1>
      <button id="emailBtn">email us</button>

  </div>
</div>
    </main>
    <footer>
        <div class="col">
            <div class="gcContainer">
                <p class="gc">MADE BY</p>
                <p class="gc name">KANISHK MALIK</p>
                <p class="gc name">CHEEKATI GANESH</p>
                <p class="gc name">AARUSHI GARG</p>
             </div>
             <h1 id="copyright">COPYRIGHT © 2025</h1>
        </div>
        <div class="smContainer">
        <a class="smTags" style=" font-weight: lighter;cursor: pointer;">FACEBOOK <span style="font-weight: bolder;">/</span></a>
        <a class="smTags" style=" font-weight: lighter;cursor: pointer;">INSTAGRAM <span style="font-weight: bolder;">/</span></a>
        <a class="smTags" style=" font-weight: lighter;cursor: pointer;">LINKEDiN <span style="font-weight: bolder;">/</span></a>
        <a class="smTags" style=" font-weight: lighter;cursor: pointer;">TWITTER</a>
        </div>
    </footer>
    <!-- Popup Contact Form -->
<div id="contactPopup" class="popup-container">
  <div class="popup-form">
    <span id="closePopup" class="close-btn">&times;</span>
    <h2>Contact Us</h2>
    <form>
      <label>Your Name</label>
      <input type="text" placeholder="Enter your name" required>
      <label>Your Email</label>
      <input type="email" placeholder="Enter your email" required>
      <label>Your Message</label>
      <textarea rows="4" placeholder="Type your message..." required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>
</div>
<script>
  const emailBtn = document.getElementById('emailBtn');
  const popup = document.getElementById('contactPopup');
  const closeBtn = document.getElementById('closePopup');
  const mainContent = document.querySelector('main');

  emailBtn.addEventListener('click', () => {
    popup.style.display = 'flex';
    mainContent.classList.add('blur');
    document.querySelector('nav').classList.add('blur');
    document.querySelector('footer').classList.add('blur');
  });

  closeBtn.addEventListener('click', () => {
    popup.style.display = 'none';
    mainContent.classList.remove('blur');
    document.querySelector('nav').classList.remove('blur');
    document.querySelector('footer').classList.remove('blur');
  });
</script>
<script src="./scripts/sign.js"></script>
</body>
</html>
