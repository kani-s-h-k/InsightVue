    <style>
      .popup-container {
  display: none; 
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(5px);
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.popup-form {
  background: white;
  padding: 2rem;
  border-radius: 10px;
  width: 90%;
  max-width: 450px;
  box-shadow: 0px 0px 20px rgba(0,0,0,0.2);
  position: relative;
  animation: popupIn 0.3s ease-out;
}

.popup-form h2 {
  margin-bottom: 1rem;
  text-align: center;
  font-weight: bold;
}

.popup-form label {
  font-size: 0.9rem;
  font-weight: 500;
}

.popup-form input,
.popup-form textarea {
  width: 100%;
  padding: 0.7rem;
  margin: 0.4rem 0 1rem 0;
  border-radius: 5px;
  border: 1px solid #ccc;
  outline: none;
}

.popup-form button {
  background-color: #E95420;
  color: white;
  padding: 0.8rem;
  width: 100%;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-size: 1rem;
}

.close-btn {
  position: absolute;
  top: 10px;
  right: 15px;
  font-size: 1.5rem;
  cursor: pointer;
  color: #333;
}

@keyframes popupIn {
  from {
    opacity: 0;
    transform: scale(0.7);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.blur {
  filter: blur(5px);
  pointer-events: none;
}

    </style>
